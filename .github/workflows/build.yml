
name: Build Arranger Drum Machine VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Configure project
        run: cmake -S ArrangerDrumMachineVST3 -B build -A x64

      - name: Compile VST3
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Arranger-Drum-Machine-VST3
          path: build/ArrangerDrumMachine_artefacts/Release/VST3/
